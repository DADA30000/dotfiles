name: Build ISO

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup ZRAM and 8GB Disk Swap FIRST (claims disk space before Nix loop allocation)
      - name: Configure Swap & ZRAM
        run: |
          # Install kernel extra modules quietly
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            linux-modules-extra-$(uname -r)

          # Load ZRAM module and configure at 100% RAM capacity (~16GB)
          sudo modprobe zram num_devices=1
          TOTAL_RAM_MB=$(free -m | awk '/^Mem:/{print $2}')
          echo zstd | sudo tee /sys/block/zram0/comp_algorithm
          echo "${TOTAL_RAM_MB}M" | sudo tee /sys/block/zram0/disksize
          sudo mkswap /dev/zram0
          sudo swapon -p 100 /dev/zram0

          # Allocate 8GB Swapfile on /mnt BEFORE nothing-but-nix claims the drive
          echo "Setting up 8GB Swapfile on /mnt..."
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon -p 10 /mnt/swapfile

          swapon --show

      # 2. Purge runner bloat & mount Btrfs space at /nix
      # (It will now see ~82GB available on /mnt and build its loop file safely)
      - name: Nothing but Nix (Rampage Mode)
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: "rampage"
          witness-carnage: true

      # 3. Tweaks & Sysctls
      - name: Configure Storage & Sysctls
        run: |
          # Remount /nix with Btrfs none compression
          echo "Remounting /nix with compress=none..."
          sudo mount -o remount,compress=none /nix

          # Adjust AppArmor for Nix unprivileged sandboxing
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          echo "=== Final Memory & Storage Setup ==="
          swapon --show
          free -h
          df -h /nix

      # 4. Install Nix
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = flakes nix-command ca-derivations
            allow-import-from-derivation = true
            auto-optimise-store = true
            build-dir = /nix/build

      # 5. Build ISO & Symlink File
      - name: Build ISO
        run: |
          nix build .#nixosConfigurations.iso.config.system.build.isoImage --fallback --max-substitution-jobs 32 -j 32

          ln -sf result/iso/*.iso nixos.iso

      # 6. Upload Direct Non-Zipped ISO Artifact
      - name: Upload ISO to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NixOS ISO
          path: nixos.iso
          archive: false
          if-no-files-found: error
          retention-days: 28
