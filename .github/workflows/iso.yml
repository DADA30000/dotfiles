name: Build ISO

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Purge all runner bloat & mount Btrfs space at /nix (~130GB total)
      - name: Nothing but Nix (Rampage Mode)
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: "rampage"
          witness-carnage: true

      # 2. Dynamic ZRAM (100% RAM), 8GB Swap, & AppArmor tweaks
      - name: Configure Memory, Swap, and Sysctls
        run: |
          # Change Btrfs compression to ZSTD Level 3
          sudo mount -o remount,compress=zstd:3 /nix

          # Detect 100% Total RAM
          TOTAL_RAM_MB=$(free -m | awk '/^Mem:/{print $2}')
          echo "Detected Total RAM: ${TOTAL_RAM_MB}MB"

          # Enable ZRAM at 100% RAM capacity
          sudo modprobe zram
          echo zstd | sudo tee /sys/block/zram0/comp_algorithm || echo lz4 | sudo tee /sys/block/zram0/comp_algorithm
          echo "${TOTAL_RAM_MB}M" | sudo tee /sys/block/zram0/disksize
          sudo mkswap /dev/zram0
          sudo swapon -p 10 /dev/zram0

          # Enable 8GB Disk Swap on /mnt
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon -p 0 /mnt/swapfile

          # Adjust AppArmor for Nix unprivileged sandboxing
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          echo "=== System Overview ==="
          free -h
          df -h

      # 3. Install Nix (must run AFTER nothing-but-nix)
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = flakes nix-command ca-derivations
            allow-import-from-derivation = true
            auto-optimise-store = true
            build-dir = /nix/build

      # 4. Build ISO
      - name: Build ISO
        run: |
          nix build .#nixosConfigurations.iso.config.system.build.toplevel --fallback --max-substitution-jobs 32 -j 32
          nix-collect-garbage -d
          nix build .#nixosConfigurations.iso.config.system.build.isoImage --fallback

      # 5. Upload ISO artifact
      - name: Upload ISO to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NixOS ISO
          path: result/iso
          if-no-files-found: error
          retention-days: 28
