name: Build ISO

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Enable kernel zswap & setup 8GB Swapfile on /mnt FIRST
      - name: Configure zswap & 8GB Disk Swap
        run: |
          # Enable zswap with zstd compression directly in sysfs
          echo zstd | sudo tee /sys/module/zswap/parameters/compressor
          echo 50 | sudo tee /sys/module/zswap/parameters/max_pool_percent
          echo 1 | sudo tee /sys/module/zswap/parameters/enabled

          # Allocate 8GB Swapfile on /mnt BEFORE nothing-but-nix claims the drive
          echo "Setting up 8GB Swapfile on /mnt..."
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          swapon --show

      # 2. Purge runner bloat & mount Btrfs space at /nix
      - name: Nothing but Nix (Rampage Mode)
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: "rampage"
          witness-carnage: true

      # 3. Tweaks & Sysctls (Disable Btrfs compression on /nix to save CPU)
      - name: Configure Storage & Sysctls
        run: |
          # Disable Btrfs compression on /nix
          sudo mount -o remount,compress=none /nix

          # Adjust AppArmor for Nix unprivileged sandboxing
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          echo "=== Final Memory & Storage Setup ==="
          swapon --show
          free -h
          df -h /nix

      # 4. Install Nix
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = flakes nix-command ca-derivations
            allow-import-from-derivation = true
            auto-optimise-store = true
            build-dir = /nix/build

      # 5. Build ISO & Symlink File
      - name: Build ISO
        run: |
          nix build .#nixosConfigurations.iso.config.system.build.isoImage --fallback --max-substitution-jobs 32 -j 32

          ln -sf result/iso/*.iso nixos.iso

      # 6. Upload Direct Non-Zipped ISO Artifact
      - name: Upload ISO to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NixOS ISO
          path: nixos.iso
          archive: false
          if-no-files-found: error
          retention-days: 28
