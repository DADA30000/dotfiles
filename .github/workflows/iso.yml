name: Build ISO

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Swap & ZRAM
        run: |
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            -o Dpkg::Options::="--force-confdef" \
            -o Dpkg::Options::="--force-confold" \
            linux-modules-extra-$(uname -r)

          sudo modprobe zram num_devices=1
          TOTAL_RAM_MB=$(free -m | awk '/^Mem:/{print $2}')
          echo zstd | sudo tee /sys/block/zram0/comp_algorithm || echo lz4 | sudo tee /sys/block/zram0/comp_algorithm
          echo "${TOTAL_RAM_MB}M" | sudo tee /sys/block/zram0/disksize
          sudo mkswap /dev/zram0
          sudo swapon -p 100 /dev/zram0

          echo "Setting up 16GB Swapfile on /mnt..."
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon -p 10 /mnt/swapfile

          swapon --show

      - name: Nothing but Nix (Rampage Mode)
        uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: "rampage"
          witness-carnage: true

      - name: Configure Storage & Sysctls
        run: |
          sudo mount -o remount,compress=none /nix

          sudo sysctl -w kernel.apparmor_restrict_unprivileged_unconfined=0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

          echo "=== Final Memory & Storage Setup ==="
          swapon --show
          free -h
          df -h /nix

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = flakes nix-command
            allow-import-from-derivation = true
            auto-optimise-store = true
            build-dir = /nix/build

      - name: Build ISO
        run: |
          (
            while true; do
              sleep 60
              echo "=== [SYS MONITOR] $(date +'%H:%M:%S UTC') ==="
              echo "--- CPU Usage & Load ---"
              uptime
              top -bn1 | grep -E "%Cpu|Cpu\(s\)"
              echo "--- Memory & Swap ---"
              free -h
              swapon --show
              echo "--- Top 5 CPU Tasks ---"
              ps -eo pid,user,%cpu,%mem,comm --sort=-%cpu | head -n 6
              echo "--- Top 5 RAM Tasks ---"
              ps -eo pid,user,%cpu,%mem,comm --sort=-%mem | head -n 6
              echo "==========================================="
            done
          ) &
          MONITOR_PID=$!
          trap "kill $MONITOR_PID 2>/dev/null || true" EXIT
          nix build .#nixosConfigurations.iso.config.system.build.isoImage --fallback --max-substitution-jobs 128 -j 32
          ln -sf result/iso/*.iso nixos.iso

      - name: Upload ISO to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NixOS ISO
          path: nixos.iso
          archive: false
          if-no-files-found: error
          retention-days: 28
